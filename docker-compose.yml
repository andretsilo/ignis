services:
  postgres:
    image: postgres:17-alpine
    container_name: ignis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ignis
      POSTGRES_PASSWORD: ignis
      POSTGRES_DB: ignis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignis"]
      interval: 5s
      timeout: 30s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: ignis-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: ignis-backend
    ports:
      - "8000:80"
    env_file: ./backend/.env
    volumes:
      - job_data:/data/jobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: ignis-worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    env_file: ./backend/.env
    volumes:
      - job_data:/data/jobs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Override at build time: VITE_API_URL=http://<your-ip>:8000 docker compose up --build
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    container_name: ignis-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  job_data:
